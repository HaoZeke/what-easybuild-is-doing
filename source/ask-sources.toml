url_strip = "docs/"

[[source]]
id = "eessi-software-layer"
kind = "code"
origin = "EESSI software-layer"
git = "https://github.com/EESSI/software-layer.git"
ref = "main"
include = ["**/*.py", "**/*.sh"]
exclude = ["**/test/**", "**/tests/**", "**/.git/**"]
