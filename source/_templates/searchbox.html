<form class="searchbox" action="{{ pathto('search') }}" method="get">
  <label class="visually-hidden" for="q">Search the book</label>
  <input type="search" id="q" name="q" placeholder="Search" aria-label="Search the book" />
  <input type="hidden" name="check_keywords" value="yes" />
  <input type="hidden" name="area" value="default" />
</form>
